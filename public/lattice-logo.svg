<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="45" fill="#0f172a" />
  
  <!-- Lattice Interconnections -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.7">
    <line x1="25" y1="25" x2="75" y2="25" />
    <line x1="25" y1="50" x2="75" y2="50" />
    <line x1="25" y1="75" x2="75" y2="75" />
    <line x1="25" y1="25" x2="25" y2="75" />
    <line x1="50" y1="25" x2="50" y2="75" />
    <line x1="75" y1="25" x2="75" y2="75" />
    <!-- Noise Diagonals -->
    <line x1="25" y1="25" x2="75" y2="75" />
    <line x1="25" y1="75" x2="75" y2="25" />
  </g>
  
  <!-- Lattice Polynomial Nodes -->
  <g fill="#a855f7">
    <circle cx="25" cy="25" r="4.5" /> <circle cx="50" cy="25" r="4.5" /> <circle cx="75" cy="25" r="4.5" />
    <circle cx="25" cy="50" r="4.5" /> <circle cx="50" cy="50" r="7" fill="#10b981" /> <!-- Secret S --> <circle cx="75" cy="50" r="4.5" />
    <circle cx="25" cy="75" r="4.5" /> <circle cx="50" cy="75" r="4.5" /> <circle cx="75" cy="75" r="4.5" />
  </g>
</svg>